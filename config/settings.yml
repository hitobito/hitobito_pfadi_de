# Settings relevant for the hitobito_pfadi_de wagon
# Overrides settings from the main application
application:
  languages:
    de: Deutsch
  additional_languages:

currency:
  unit: EUR

  # non UI languages for assigning to person#language
  # additional_languages:
  #   en: Englisch

additional_address:
  enabled: true

phone_number:
  predefined_labels:
    - Privat
    - Mobil
    - Arbeit
    - Erziehungsberechtigte
    - Fax
    - Andere

groups:
  bdp:
    enabled: true
  dpsg:
    enabled: false
  period_invoice_templates:
    enabled: true
    item_classes:
      "PeriodInvoiceTemplate::FeeCalculationItem":
      "PeriodInvoiceTemplate::RoleCountItem":
        role_types: []

# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
root_email: hitobito-pfadi-de@puzzle.ch

people:
  people_managers:
    enabled: true
    self_service_managed_creation:
      enabled: false

membership_fees:
  relative_fee_rates:
    enabled: false
  half_year_periods:
    enabled: false
  only_active_people:
    enabled: false
